name: Monthly Bounce-Back Report

on:
  schedule:
    - cron: '0 8 1 * *'   # 8am UTC on the 1st of every month
  workflow_dispatch:        # allow manual trigger from GitHub Actions UI (click "Run workflow")

jobs:
  generate-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report
        run: python3 main.py

      - name: Commit report to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Monthly report $(date +%Y-%m)"
          git push
